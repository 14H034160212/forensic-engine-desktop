name: Build installers (Tauri)

# Produces real installers (.dmg / .msi / .nsis / .AppImage) by wrapping the PyInstaller
# binary as a Tauri sidecar, and on a v* tag publishes them to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.11"

      - name: Python deps
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r forensic_app/requirements-laptop.txt pyinstaller

      # macOS uses uv's standalone CPython instead of setup-python. setup-python's macOS build ships
      # the stdlib C extensions as ~55 separate lib-dynload/*.so files; the onefile engine unpacks
      # and dlopen()s every one of them on EACH launch, and macOS security-checks each new file —
      # measured 11-17 s to start vs ~2 s with the standalone build (extensions linked into libpython).
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'
      - name: Python + deps (macOS, standalone CPython)
        if: runner.os == 'macOS'
        run: |
          uv venv -p 3.11 --python-preference only-managed .venv
          uv pip install -p .venv -r forensic_app/requirements-laptop.txt pyinstaller
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import sys, sysconfig; print(sys.version, sysconfig.get_config_var('Py_ENABLE_SHARED'))"

      - name: Build PyInstaller binary (non-Windows)
        if: runner.os != 'Windows'
        run: bash forensic_app/desktop/build.sh

      - name: Guard (macOS) — engine must not unpack stdlib .so files at launch
        if: runner.os == 'macOS'
        run: |
          python - <<'EOF'
          from PyInstaller.archive.readers import CArchiveReader
          n = sum('lib-dynload/' in x for x in CArchiveReader('desktop_dist/ForensicEngine').toc)
          print('lib-dynload entries:', n)
          assert n == 0, 'setup-python-style CPython slipped in: macOS launch will be ~10 s slower'
          EOF

      - name: Build PyInstaller binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: forensic_app\desktop\build.bat

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: forensic_app/desktop/tauri/src-tauri

      - name: Linux system deps (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Install Tauri CLI (prebuilt, no compile)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli

      - name: Place sidecar binary (target-triple name)
        working-directory: forensic_app/desktop/tauri
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ../../../desktop_dist/ForensicEngine.exe "src-tauri/binaries/engine-server-${TRIPLE}.exe"
          else
            cp ../../../desktop_dist/ForensicEngine "src-tauri/binaries/engine-server-${TRIPLE}"
            chmod +x "src-tauri/binaries/engine-server-${TRIPLE}"
          fi
          echo "sidecar: engine-server-${TRIPLE}"

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: forensic_app/desktop/tauri
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i.bak 's/"version": "[^"]*"/"version": "'"$V"'"/' src-tauri/tauri.conf.json
          rm -f src-tauri/tauri.conf.json.bak
          echo "app version set to $V"

      - name: Generate icons
        working-directory: forensic_app/desktop/tauri
        run: cargo tauri icon src-tauri/icon-source.png

      - name: Build installer
        working-directory: forensic_app/desktop/tauri
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          rustup target add "$TRIPLE" || true
          # pin the build target to the host so it matches the sidecar name we placed
          cargo tauri build --target "$TRIPLE"

      # Fixed, version-less file names: README and the in-app /download page link to
      # releases/latest/download/<name>, which then always serves the newest version.
      - name: Stable download names
        run: |
          B=$(echo forensic_app/desktop/tauri/src-tauri/target/*/release/bundle)
          mkdir -p release_assets
          case "$RUNNER_OS" in
            macOS)
              case "$(uname -m)" in arm64) A=arm64;; *) A=x64;; esac
              cp "$B"/dmg/*.dmg "release_assets/ForensicEngine-mac-$A.dmg" ;;
            Windows)
              cp "$B"/nsis/*-setup.exe release_assets/ForensicEngine-windows-x64-setup.exe
              cp "$B"/msi/*.msi        release_assets/ForensicEngine-windows-x64.msi ;;
            Linux)
              # (no .deb: tauri.conf.json bundle targets are dmg/msi/appimage/nsis)
              cp "$B"/appimage/*.AppImage release_assets/ForensicEngine-linux-x64.AppImage ;;
          esac
          ls -la release_assets

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release_assets/*
          if-no-files-found: error

  # Publish all installers to a GitHub Release when a v* tag is pushed → a stable download page.
  release:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4          # for the per-OS install notes below
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: false
